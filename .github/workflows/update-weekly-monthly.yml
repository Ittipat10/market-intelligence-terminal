name: Update Weekly & Monthly EMA 10 Scanner

on:
  schedule:
    # Runs every Monday at 10:00 AM Bangkok Time (03:00 UTC, UTC+7) when Thai market opens
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  scan-and-update-wm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly & Monthly EMA 10 Scanner
        run: |
          python scanner_weekly_monthly.py

      - name: Commit and Push Updated Weekly & Monthly Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan-results-wm.json
          git diff --staged --quiet || (git commit -m "Automated: Update Weekly & Monthly EMA 10 scan data [skip ci]" && git push)
